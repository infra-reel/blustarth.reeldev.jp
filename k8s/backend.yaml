
---
apiVersion: external-secrets.io/valpha1
kind: ExternalSecret
metadata:
  name: bluestarth-secret
  namespace: bluestarth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: bluestarth-secret
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/bluestarth
        property: jwt-secret
    - secretKey: DISCORD_CLIENT_ID
      remoteRef:
        key: secret/bluestarth
        property: discord-client-id
    - secretKey: DISCORD_CLIENT_SECRET
      remoteRef:
        key: secret/bluestarth
        property: discord-client-secret
    - secretKey: DISCORD_ADMIN_IDS
      remoteRef:
        key: secret/bluestarth
        property: discord-admin-ids
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bluestarth-backend-data-pv
  labels:
    capsule.clastix.io/tenant: apps
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: bluestarth-nfs
  nfs:
    server: 172.16.230.200
    path: /nfs/bluestarth
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  namespace: bluestarth
  labels:
    capsule.clastix.io/tenant: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: bluestarth-nfs
  volumeName: bluestarth-backend-data-pv
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bluestarth-backend
  namespace: bluestarth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bluestarth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: bluestarth-backend
      containers:
        - name: backend
          image: ghcr.io/infra-reel/bluestarth-backend:latest
          ports:
            - containerPort: 4000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          command:
            - node
          args:
            - index.js
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bluestarth-secret
                  key: JWT_SECRET
            - name: DISCORD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: bluestarth-secret
                  key: DISCORD_CLIENT_ID
            - name: DISCORD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bluestarth-secret
                  key: DISCORD_CLIENT_SECRET
            - name: DISCORD_ADMIN_IDS
              valueFrom:
                secretKeyRef:
                  name: bluestarth-secret
                  key: DISCORD_ADMIN_IDS
            - name: DB_PATH
              value: /data/db.sqlite
            - name: UPLOAD_DIR
              value: /data/uploads
            - name: DISCORD_REDIRECT_URI
              value: "https://bluestarth.reeldev.jp/manage/callback"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: bluestarth
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
