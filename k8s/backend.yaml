apiVersion: v1
kind: Namespace
metadata:
  name: bluestarth
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  namespace: bluestarth
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bluestarth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        # Vault Agent Injector の有効化
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "bluestarth-role"
        # Vault から取得するパスと出力設定
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/bluestarth"
        vault.hashicorp.com/agent-inject-path-config: "config"
        # 環境変数形式（export KEY=VALUE）で出力するテンプレート
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/bluestarth" -}}
          export JWT_SECRET="{{ .Data.data["jwt-secret"] }}"
          export DISCORD_CLIENT_ID="{{ .Data.data["discord-client-id"] }}"
          export DISCORD_CLIENT_SECRET="{{ .Data.data["discord-client-secret"] }}"
          export DISCORD_ADMIN_IDS="{{ .Data.data["discord-admin-ids"] }}"
          {{- end -}}
    spec:
      nodeSelector:
        tier: prod
      containers:
        - name: backend
          image: ghcr.io/infra-reel/bluestarth-backend:latest
          # Vault Agent が /vault/secrets/config を生成するまで待機してから起動
          command: ["/bin/sh", "-c"]
          args:
            - |
              while [ ! -f /vault/secrets/config ]; do sleep 1; done
              . /vault/secrets/config
              exec node index.js
          ports:
            - containerPort: 4000
          env:
            - name: DB_PATH
              value: /data/db.sqlite
            - name: DISCORD_REDIRECT_URI
              value: "https://bluestarth.reeldev.jp/manage/callback"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: bluestarth
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
