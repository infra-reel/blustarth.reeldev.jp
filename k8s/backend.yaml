---
apiVersion: v1
kind: Namespace
metadata:
  name: bluestarth
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  namespace: bluestarth
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bluestarth-backend
  namespace: bluestarth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bluestarth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "bluestarth-role"
        vault.hashicorp.com/agent-inject-secret-app.env: "secret/data/bluestarth/app"
        vault.hashicorp.com/agent-inject-template-app.env: |
          {{- with secret "secret/data/bluestarth/app" -}}
          export JWT_SECRET="{{ .Data.data.jwt-secret }}"
          export DISCORD_CLIENT_ID="{{ .Data.data.discord-client-id }}"
          export DISCORD_CLIENT_SECRET="{{ .Data.data.discord-client-secret }}"
          export DISCORD_ADMIN_IDS="{{ .Data.data.discord-admin-ids }}"
          {{- end }}
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-cache-enable: "true"
    spec:
      serviceAccountName: bluestarth-backend
      nodeSelector:
        tier: prod
      containers:
        - name: backend
          image: ghcr.io/infra-reel/bluestarth-backend:latest
          ports:
            - containerPort: 4000
          # Vault Agent が /vault/secrets/app.env を書き終わるまで待ってから起動
          command:
            - /bin/sh
            - -c
            - |
              until [ -f /vault/secrets/app.env ]; do sleep 1; done
              . /vault/secrets/app.env
              node index.js
          env:
            - name: DB_PATH
              value: /data/db.sqlite
            - name: UPLOAD_DIR
              value: /data/uploads
            - name: DISCORD_REDIRECT_URI
              value: "https://bluestarth.reeldev.jp/manage/callback"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: bluestarth
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
