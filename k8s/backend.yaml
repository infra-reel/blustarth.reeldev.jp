---
apiVersion: v1
kind: Namespace
metadata:
  name: bluestarth
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  namespace: bluestarth
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
# Vault Agent が Kubernetes SA トークンで認証するための ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bluestarth-backend
  namespace: bluestarth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bluestarth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        # ── Vault Agent Injector アノテーション ──────────────────
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "bluestarth-role"

        # /vault/secrets/app.env として注入
        # シェル export 形式で書き出す → envFrom でソース可能
        vault.hashicorp.com/agent-inject-secret-app.env: "secret/data/bluestarth/app"
        vault.hashicorp.com/agent-inject-template-app.env: |
          {{- with secret "secret/data/bluestarth/app" -}}
          export JWT_SECRET="{{ .Data.data.jwt-secret }}"
          export DISCORD_CLIENT_ID="{{ .Data.data.discord-client-id }}"
          export DISCORD_CLIENT_SECRET="{{ .Data.data.discord-client-secret }}"
          export DISCORD_ADMIN_IDS="{{ .Data.data.discord-admin-ids }}"
          {{- end }}

        # init コンテナで1回取得後にキャッシュ（Podが起動すれば Vault 障害に耐性）
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-cache-enable: "true"
    spec:
      serviceAccountName: bluestarth-backend
      nodeSelector:
        tier: prod
      initContainers:
        # シークレットをロードしてから本体を起動するためのラッパー
        - name: env-loader
          image: busybox:1.36
          command: ["/bin/sh", "-c", "cp /vault/secrets/app.env /shared/app.env"]
          volumeMounts:
            - name: shared-env
              mountPath: /shared
      containers:
        - name: backend
          image: ghcr.io/YOUR_ORG/bluestarth-backend:latest
          ports:
            - containerPort: 4000
          command: ["/bin/sh", "-c", ". /shared/app.env && node index.js"]
          env:
            - name: DB_PATH
              value: /data/db.sqlite
            - name: UPLOAD_DIR
              value: /data/uploads
            - name: DISCORD_REDIRECT_URI
              value: "https://bluestarth.reeldev.jp/manage/callback"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: shared-env
              mountPath: /shared
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
        - name: shared-env
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: bluestarth
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
