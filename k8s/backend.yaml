apiVersion: v1
kind: Namespace
metadata:
  name: bluestarth
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  namespace: bluestarth
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bluestarth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        # Vault Agent Injector の有効化
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "bluestarth-role"
        # Vault から取得するパスと環境変数ファイルの生成設定
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/bluestarth"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/bluestarth" -}}
          export JWT_SECRET="{{ .Data.data.jwt_secret }}"
          export DISCORD_CLIENT_ID="{{ .Data.data.discord_client_id }}"
          export DISCORD_CLIENT_SECRET="{{ .Data.data.discord_client_secret }}"
          export DISCORD_ADMIN_IDS="{{ .Data.data.discord_admin_ids }}"
          {{- end -}}
    spec:
      nodeSelector:
        tier: prod
      containers:
        - name: backend
          image: ghcr.io/infra-reel/bluestarth-backend:latest
          # Vault Agent が生成したスクリプトを読み込んでからアプリケーションを起動
          command: ["/bin/sh", "-c"]
          args: ["source /vault/custom-metadata/config && exec node index.js"]
          ports:
            - containerPort: 4000
          env:
            - name: DB_PATH
              value: /data/db.sqlite
            - name: DISCORD_REDIRECT_URI
              value: "https://bluestarth.reeldev.jp/manage/callback"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: bluestarth
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
