---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bluestarth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        tier: prod
      containers:
        - name: frontend
          image: ghcr.io/infra-reel/bluestarth-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: BACKEND_URL
              value: "http://backend.bluestarth.svc.cluster.local:4000"
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_SITE_URL
              value: "https://bluestarth.reeldev.jp"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: bluestarth
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
