---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bluestarth-ingress
  namespace: bluestarth
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # TLS は cert-manager 等で別途管理
spec:
  ingressClassName: nginx
  rules:
    - host: bluestarth.reeldev.jp
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
  tls:
    - hosts:
        - bluestarth.reeldev.jp
      secretName: bluestarth-tls
