apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bluestarth-ingress
  namespace: bluestarth
spec:
  ingressClassName: traefik
  rules:
    - host: bluestarth.reeldev.jp
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
  tls:
    - hosts:
        - bluestarth.reeldev.jp
      secretName: bluestarth-tls
